version: 0.0

files:
  - source: /
    destination: /home/ubuntu/node-app

hooks:

  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 300
      runas: ubuntu

  BeforeInstall:
    - location: scripts/install.sh
      timeout: 300
      runas: ubuntu

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: ubuntu
